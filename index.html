<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
   
    <title>Quarter 2 Seatwork 1</title>

    <link rel="icon" type="image/x-icon" href="logo.png">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #20173e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: url('background.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.6rem;
            color: #20173e;
            margin-bottom: 5px;
            /* found on google */
            text-shadow: 0 0 12px #f9e3b8;
        }

        header p {
            font-size: 1.1rem;
            color: #4a3078;
            /* found on google */
            text-shadow: 0 0 12px #f9e3b8;
        }

        main {
            background: rgba(86, 56, 139, 0.7);
            padding: 30px;
            border-radius: 14px;
            width: 380px;
            text-align: center;
            /* found on google */
            border: 3px solid #56388b; 
            box-shadow: 0 0 20px #56388b; 
        }

        form {
            padding: 5px;
        }

        input[type="text"] {
            width: 90%;
            padding: 12px 14px;
            margin: 10px 0;
            border: 2px solid #56388b;
            border-radius: 6px;
            font-size: 15px;
            background: #4a3078;
            color: white;
        }

        input[type="text"]::placeholder {
            color: #d1c4e9;
        }

        input[type="text"]:focus {
            border-color: #f9e3b8;
            outline: none;
        }

        input[type="button"] {
            background-color: #755c81;
            color: white;
            border: none;
            padding: 12px 16px;
            margin-top: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            /* found on google */
            box-shadow: 0 0 15px #f9e3b8;
            transition: all 0.3s ease;
        }

        input[type="button"]:hover {
            background-color: #967185;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
            color: #f9e3b8;
        }
    </style>
</head>
<body>
    <header>
        <div class="reactor">
            <img src="logo.png" alt="logo" height="100px" class="rounded">
        </div>
        <h1>Math Guild</h1>
        <p>This club is the best</p>
    </header>

    <main>
        <form>
            <input type="text" id="first_name" placeholder="Enter your First Name"><br>
            <input type="text" id="last_name" placeholder="Enter your Last Name"><br>
            <input type="button" py-click="candidate_checker" value="Enter">
        </form>
        <div id="result"></div>
    </main>
    <py-script src="main.py"></py-script>
</body>
</html>
